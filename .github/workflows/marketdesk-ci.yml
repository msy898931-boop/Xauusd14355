name: marketdesk-ci

# The gates the desk is held to, run on every change. The same three commands
# the README tells a person to run, so a green run here and a green run locally
# mean the same thing. Keyless and offline: no secret is read, so a fork's PR
# can be checked too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: marketdesk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketdesk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the desk and the dev tools
        run: pip install -e ".[dev]"

      - name: Tests
        run: python3 -m pytest tests -q

      - name: Types
        run: python3 -m mypy desk

      - name: Lint
        run: python3 -m ruff check .
