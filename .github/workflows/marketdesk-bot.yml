name: marketdesk-bot

# The button on the Telegram chat, served without a server.
#
# A webhook would need a long-lived HTTPS endpoint; this repository has none.
# So the chat is polled instead -- but with a long poll, not a short one. Each
# run connects to Telegram and STAYS connected for a few minutes, so a press is
# answered in about a second instead of waiting for the next scheduled run.
# `--listen` is what buys that: `getUpdates` blocks on Telegram's side and
# returns the instant something arrives.
#
# WHY A FIVE-MINUTE CRON IS STILL CORRECT
# The listen window must fit INSIDE the five-minute gap, with the ~45s of
# checkout + install on top. It did not: 260s of listening plus setup ran ~5.5
# minutes, so each run overran the next trigger and `concurrency` kept dropping
# the one behind it -- the schedule fired, but most runs were skipped. 200s of
# listening leaves ~1.5 minutes of headroom, so a run ends before the next one
# is due and nothing is dropped. Two runs must never overlap -- they would race
# for the same update -- which `concurrency` also enforces.
#
# The state is confirmed to Telegram, not kept locally. A runner is a fresh VM
# with no disk, so a local "last seen" pointer would be lost and every pass
# would replay the same press. Telegram confirms an update only when a LATER
# `getUpdates` passes a higher offset, so the pass ends by sending the offset
# back; that makes the pass idempotent with nothing of ours to lose.
#
# HONEST LIMITS -- measured on this repository, 2026-11-03
#   * GitHub's `schedule` is BEST-EFFORT, not a guarantee. It can be delayed, and
#     queued runs can be dropped under load. On this repo a `*/5` cron produced
#     only 2 scheduled runs in ~17 hours, while `workflow_dispatch` always worked.
#     So a press is usually answered in about a second -- but the window is only
#     200s out of every 5 minutes, and a dropped run widens that to ~5 minutes or
#     more. Do not promise "instant".
#   * The cron starts at :02, not :00. The top of the hour is the single most
#     congested slot GitHub has; an odd offset is the only knob they give us.

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      publish_menu:
        description: "Publish the button menu to the chat (run once to get the buttons)"
        type: boolean
        default: false
      listen_seconds:
        description: "How long to stay connected to Telegram. Default 200s fits the 5-minute cron; a manual run may go longer."
        type: number
        default: 200

concurrency:
  group: marketdesk-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    # A manual run may listen longer than the cron window, so the job ceiling is
    # set by the longest listen we allow, not by the 5-minute schedule.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # restore-only: the watch workflow owns this cache key. Saving here too
      # would race it, and the loser's write is discarded.
      - name: Restore desk state
        uses: actions/cache/restore@v4
        with:
          path: marketdesk/data
          key: desk-state-${{ github.run_id }}
          restore-keys: desk-state-

      - name: Install the desk
        run: pip install -e marketdesk

      # A silent run cannot be told apart from an unconfigured one, so the
      # presence of the secrets is stated explicitly -- never their values.
      - name: Check the secrets are wired
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GROQ_API_KEY; do
            val="${!v}"
            if [ -z "$val" ]; then echo "$v: MISSING"; else echo "$v: set (length ${#val})"; fi
          done

      # The transport has to match the deployment. Telegram serves updates to a
      # webhook OR to getUpdates, never both: while the Render daemon has a
      # webhook registered, every poll here fails with a bare 409. Asking first
      # turns that into a clear, non-fatal note instead of a red run.
      - name: Which transport is Telegram serving?
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m desk.cli telegram || true

      # 200s of listening inside a 5-minute cron leaves room for the ~45s of
      # checkout + install: the run ends with margin, and the next one starts
      # after it. A press lands in about a second. A manual dispatch may pass a
      # longer `listen_seconds` for a hands-on session.
      #
      # A 409 (webhook registered) is not a failure of this job -- it means the
      # Render daemon owns the transport, which is the better setup. Exiting 0 on
      # it keeps the schedule green and stops a healthy deployment from looking
      # broken.
      - name: Listen for presses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          out=$(python3 -m desk.cli bot --listen \
            --seconds ${{ inputs.listen_seconds || 200 }} \
            ${{ inputs.publish_menu && '--greet' || '' }} 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -q "409"; then
            echo "::notice::A webhook is registered, so Telegram will not serve getUpdates. The Render daemon is answering presses; this poll is redundant by design."
            exit 0
          fi
          exit $code
