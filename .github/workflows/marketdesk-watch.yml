# Run the MarketDesk watch loop on a schedule, from GitHub itself.
#
# WHY THIS INSTEAD OF RENDER
# MarketDesk has no HTTP server -- it is a CLI plus a watch loop -- so it needs
# a scheduler, not a web service. GitHub Actions gives one for free on a public
# repository, with no credit card and no extra account.
#
# WHAT THE OWNER MUST DO ONCE (3 repo secrets, Settings -> Secrets -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GROQ_API_KEY
# Without them the run still succeeds but the desk stays silent by design.
#
# HONEST LIMITS (do not describe this as a precise 24/7 schedule):
#   * GitHub's `schedule` is best-effort -- it can start 5-15+ minutes late under
#     load, and it is skipped entirely if the previous run is still going.
#   * Scheduled workflows are disabled after ~60 days with no repository
#     activity; see keepalive.yml, which prevents that weekly.
#   * A runner is a fresh VM each time, so there is no persistent disk. The
#     dedupe ledger is carried in the Actions cache (best-effort), which is why
#     a cache miss is not treated as a failure.
name: marketdesk-watch

on:
  schedule:
    # Every 15 minutes, Sunday to Friday (cron day-of-week: 0=Sun ... 6=Sat).
    # The spot market is shut from Friday's New York close until Sydney opens on
    # Sunday night, so a Saturday scan reads a frozen tape. The desk also stands
    # down on a closed market on its own (desk/session.py) -- this keeps the
    # schedule from even waking a runner. GitHub cron is UTC and best-effort:
    # runs can be delayed or dropped, so the offset (:07, :22, :37, :52) avoids
    # the top of the hour, GitHub's most congested slot.
    - cron: "7-59/15 * * * 0-5"
  # Manual trigger, for testing the pipeline end to end.
  workflow_dispatch:
    inputs:
      check_alerts:
        description: "Send a real Telegram test message (proves the alert path)"
        type: boolean
        default: false
      send_scenarios:
        description: "Send the conditional scenarios to the chat"
        type: boolean
        default: false
      send_analysis:
        description: "Run a full analysis and send it to the chat"
        type: boolean
        default: false
      level_hold_seconds:
        description: "How long the level watch should hold, in seconds (default 600)"
        type: number
        default: 600

# Two passes must not overlap when they would both mutate the ledger and the
# SQLite store -- but a GLOBAL group was worse than the race it prevented. A
# 3-hour level hold monopolised the group, so a dispatch asking for a read sat
# queued behind it for over an hour and read as "the desk is broken" to the
# person who asked. The group is now keyed on the event and the hold length, so
# a long hold cannot block a read. Worst case of an overlap is a duplicate alert,
# which the ledger already tolerates: a cache key is unique per run, so each run
# gets its own copy of the store and no write can be corrupted by a neighbour.
concurrency:
  group: marketdesk-watch-${{ github.event_name }}-${{ github.event.inputs.level_hold_seconds || 'sched' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # The level watch holds across the cron window (and, on a manual dispatch,
    # for hours), so the job ceiling must clear the longest hold we allow, not
    # the 15-minute schedule. GitHub-hosted runners cap at 360 minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Carry the dedupe ledger (and the SQLite store) between runs. The cache
      # is the only durable storage a runner has; a miss costs a duplicate
      # alert at worst, never a wrong one.
      - name: Restore desk state
        uses: actions/cache@v4
        with:
          path: marketdesk/data
          key: desk-state-${{ github.run_id }}
          restore-keys: |
            desk-state-

      - name: Install the desk
        run: pip install -e marketdesk

      # Reports PRESENCE, never a value. The desk is silent by design, so a
      # missing secret and "no signal yet" look identical from outside; this is
      # the honest way to tell "not configured" from "quiet".
      - name: Check the secrets are wired
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GROQ_API_KEY; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "$v: MISSING"
            else
              echo "$v: set (length ${#val})"
            fi
          done

      - name: One watch pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # One reading. Alerts only on an actionable signal above
        # DESK_ALERT_SCORE, and never the same one twice. It also grades every
        # past call that now has a horizon behind it, so the record grows without
        # anyone pressing a button.
        run: python3 -m desk.cli watch

      # Print the running record into the log. The desk is silent by design, so
      # without this the only place the scoreboard exists is a Telegram button --
      # and a record nobody reads is a record that cannot correct anything. This
      # makes each pass state, in the log, what the desk has actually scored.
      - name: Scoreboard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -m desk.cli hit-rate || true

      # The desk alerts on its own verdict; this alerts on the levels a plan is
      # built around. The orchestrator can say "no trade" for weeks while price
      # sits between a trigger and a stop, and the moment one side is decided is
      # still worth a message. Each level fires once (the ledger keys on
      # level+side), so re-checking does not repeat itself.
      #
      # It HOLDS for most of the cron window rather than checking once and
      # exiting. GitHub's `schedule` is best-effort, and on this repository it has
      # fired a few times a day against a 15-minute cron -- an alert that needs
      # every slot to fire is one that mostly does not arrive. Holding for 13 of
      # the 15 minutes means a level touched at any point in the hour is seen,
      # even when the next two slots are dropped, and it costs the same one job.
      # The check itself is a keyless quote fetch, so 13 minutes of it is cheap.
      - name: Level alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 10 minutes = 600s by default, leaving headroom under the 15-minute cron
        # so a run ends before the next is due (concurrency would drop the one
        # behind it). A manual dispatch may hold for hours.
        run: python3 -m desk.cli levels --hold ${{ inputs.level_hold_seconds || 600 }} --every 60

      # Optional: proves the alert path end to end on demand, because a silent
      # watch pass cannot tell "not configured" from "no signal yet". The
      # getMe call is the only honest proof a token works.
      - name: Send a test alert
        if: ${{ inputs.check_alerts }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -m desk.cli check-alerts --send

      # Optional: the conditional scenarios, computed from the levels this pass
      # just stored. Runs AFTER the watch pass so it reads fresh candles, and
      # needs no model — the numbers are all computed.
      - name: Send the scenarios
        if: ${{ inputs.send_scenarios }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m desk.cli scenarios --send

      # The full read, on demand: every agent's study plus the final call. Sent
      # from CI because the real token lives in repo secrets, not in any shell
      # this desk is driven from.
      - name: Send the full analysis
        if: ${{ inputs.send_analysis }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -m desk.cli run --send
