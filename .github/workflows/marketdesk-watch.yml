# Run the MarketDesk watch loop on a schedule, from GitHub itself.
#
# WHY THIS INSTEAD OF RENDER
# MarketDesk has no HTTP server -- it is a CLI plus a watch loop -- so it needs
# a scheduler, not a web service. GitHub Actions gives one for free on a public
# repository, with no credit card and no extra account.
#
# WHAT THE OWNER MUST DO ONCE (3 repo secrets, Settings -> Secrets -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GROQ_API_KEY
# Without them the run still succeeds but the desk stays silent by design.
#
# HONEST LIMITS (do not describe this as a precise 24/7 schedule):
#   * GitHub's `schedule` is best-effort -- it can start 5-15+ minutes late under
#     load, and it is skipped entirely if the previous run is still going.
#   * Scheduled workflows are disabled after ~60 days with no repository
#     activity; see keepalive.yml, which prevents that weekly.
#   * A runner is a fresh VM each time, so there is no persistent disk. The
#     dedupe ledger is carried in the Actions cache (best-effort), which is why
#     a cache miss is not treated as a failure.
name: marketdesk-watch

on:
  schedule:
    # Every 15 minutes, Sunday to Friday (cron day-of-week: 0=Sun ... 6=Sat).
    # The spot market is shut from Friday's New York close until Sydney opens on
    # Sunday night, so a Saturday scan reads a frozen tape. The desk also stands
    # down on a closed market on its own (desk/session.py) -- this keeps the
    # schedule from even waking a runner. GitHub cron is UTC and best-effort.
    - cron: "*/15 * * * 0-5"
  # Manual trigger, for testing the pipeline end to end.
  workflow_dispatch:
    inputs:
      check_alerts:
        description: "Send a real Telegram test message (proves the alert path)"
        type: boolean
        default: false
      send_scenarios:
        description: "Send the conditional scenarios to the chat"
        type: boolean
        default: false

# Never let two passes overlap: the second would race the first on the ledger.
concurrency:
  group: marketdesk-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Carry the dedupe ledger (and the SQLite store) between runs. The cache
      # is the only durable storage a runner has; a miss costs a duplicate
      # alert at worst, never a wrong one.
      - name: Restore desk state
        uses: actions/cache@v4
        with:
          path: marketdesk/data
          key: desk-state-${{ github.run_id }}
          restore-keys: |
            desk-state-

      - name: Install the desk
        run: pip install -e marketdesk

      # Reports PRESENCE, never a value. The desk is silent by design, so a
      # missing secret and "no signal yet" look identical from outside; this is
      # the honest way to tell "not configured" from "quiet".
      - name: Check the secrets are wired
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GROQ_API_KEY; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "$v: MISSING"
            else
              echo "$v: set (length ${#val})"
            fi
          done

      - name: One watch pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # One reading. Alerts only on an actionable signal above
        # DESK_ALERT_SCORE, and never the same one twice.
        run: python3 -m desk.cli watch

      # The desk alerts on its own verdict; this alerts on the levels a plan is
      # built around. The orchestrator can say "no trade" for weeks while price
      # sits between a trigger and a stop, and the moment one side is decided is
      # still worth a message. Each level fires once (the ledger keys on
      # level+side), so a 15-minute cron does not repeat itself.
      - name: Level alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m desk.cli levels

      # Optional: proves the alert path end to end on demand, because a silent
      # watch pass cannot tell "not configured" from "no signal yet". The
      # getMe call is the only honest proof a token works.
      - name: Send a test alert
        if: ${{ inputs.check_alerts }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 -m desk.cli check-alerts --send

      # Optional: the conditional scenarios, computed from the levels this pass
      # just stored. Runs AFTER the watch pass so it reads fresh candles, and
      # needs no model — the numbers are all computed.
      - name: Send the scenarios
        if: ${{ inputs.send_scenarios }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m desk.cli scenarios --send
