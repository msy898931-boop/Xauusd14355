[project]
name = "marketdesk"
version = "0.1.0"
description = "Multi-agent market & news analysis desk (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "pyyaml"]

[project.scripts]
marketdesk = "desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["desk", "desk.agents", "desk.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The three gates the desk is held to: tests, types, lint. `mypy` has caught a
# real bug tests missed (a dict used as a string), so it is not decoration.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["desk"]
