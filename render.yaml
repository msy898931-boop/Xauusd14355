# Render blueprint for MarketDesk alerting (Xauusd14355).
#
# ONE SERVICE, AND WHY IT MUST STAY ONE
# The free tier gives a workspace 750 instance-hours a month, shared across ALL
# free services -- not 750 each. A single always-on web service already spends
# 720-744 h (30-31 days x 24). A SECOND free service running even 20 h pushes the
# workspace to 764 h, over the cap, and Render suspends EVERY free service in the
# workspace until the next month. So a "belt-and-braces" second service does not
# back the desk up -- it takes the desk down. One service it is.
#
# WHY A WEB SERVICE AND NOT A CRON JOB
# Render Cron Jobs have NO free instance type: the cheapest bills ~$1/month
# (prorated by the second, $1 minimum per service). A web service is free. And a
# *web* service can serve the chat, which a cron job cannot: Telegram pushes a
# press to an INBOUND endpoint (answered the instant it happens), and `/health`
# is inbound traffic, so a plain uptime ping keeps a free instance awake. A long
# poll is entirely outbound and would never wake a sleeping host, so `--web` is
# what makes the free tier usable here at all.
#
# THE CRON FALLBACK IS DELIBERATELY ABSENT
# It used to be here as a second opinion. It cannot be: see the hour budget
# above. The always-on service already checks the levels every 30s and re-reads
# the market every 15 min, which is strictly more than a 15-minute cron did.
#
# CAVEATS of the free instance (512 MB / 0.1 CPU, no disk):
#   * no persistent disk -> DESK_HOME is lost on every restart, so the alert
#     ledger forgets what it sent. Either accept a rare duplicate alert, or add
#     a disk on a paid plan ($0.25/GB/month).
#   * 0.1 CPU -> keep the level cadence coarse (30-60s), not the 10s default.
#   * 5 GB outbound bandwidth a month (Hobby, since Apr 2026). Measured need is
#     ~0.6 GB/month, so this is not close -- but it is the cap that suspends the
#     service if something ever goes into a loop.
services:
  # ---- the always-on desk (web service) --------------------------------
  # One resident process: the chat, the levels, and the readings.
  #
  # THE NAME IS THE LIVE ONE, ON PURPOSE. The service was created by hand, so
  # Render named it `Xauusd14355-4`, not the `marketdesk-daemon` this file used to
  # say. If the two disagree, syncing this blueprint would create a SECOND service
  # -- which is exactly the 750-hour breach the header warns about. A blueprint
  # name is not decoration; it is what the deploy creates.
  - type: web
    name: Xauusd14355-4
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DESK_HOME
        value: /tmp/desk        # ephemeral on free; a paid disk mounts at /data
      - key: DESK_SYMBOL
        value: XAUUSD
      - key: DESK_LEVEL_EVERY  # free 0.1 CPU cannot sustain the 10s default
        value: "30"
      - key: DESK_READ_EVERY
        value: "900"
      # The free tier sleeps after ~15 min with no INBOUND traffic, and the only
      # inbound traffic is a Telegram push -- which a quiet chat never sends. So
      # the daemon pings its OWN /health on this cadence, well inside the window,
      # or the host sleeps and the next press meets a dead instance. 600s is the
      # default; it is written here so the number is visible, not implied.
      - key: DESK_PING_EVERY
        value: "600"
      - key: DESK_ALERT_SCORE
        value: "0.25"
      - key: DESK_MIN_RR
        value: "1.5"
      - key: DESK_EVENT_WINDOW_H
        value: "6"
      # Secrets: set in the Render dashboard, never written to git. The webhook
      # base is injected automatically as RENDER_EXTERNAL_URL, so the daemon
      # registers itself with Telegram on boot -- no URL to paste.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # A shared secret Telegram echoes back on every push; a forged POST is
      # rejected before it reaches an action. Generate any random string.
      - key: DESK_WEBHOOK_SECRET
        sync: false
